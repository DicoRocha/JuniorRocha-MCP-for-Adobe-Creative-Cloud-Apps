<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: sans-serif;
      color: #e0e0e0;
      padding: 10px;
      font-size: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .status {
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .ok { background: #1b5e20; color: #c8e6c9; }
    .err { background: #b71c1c; color: #ffcdd2; }
    #log {
      margin-top: 8px;
      font-family: monospace;
      font-size: 11px;
      height: 110px;
      overflow-y: auto;
      background: #141414;
      padding: 6px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="header">
    <span><strong>Junior Rocha MCP</strong></span>
    <span id="status" class="status err">Disconnected</span>
  </div>
  <div>
    <sp-button id="btnToggle" size="s" variant="primary">Reconectar</sp-button>
    <sp-button id="btnPower" size="s" variant="secondary">Desligar MCP neste app</sp-button>
  </div>
  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
