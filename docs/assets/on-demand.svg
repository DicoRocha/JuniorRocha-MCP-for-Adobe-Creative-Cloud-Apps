kills + 1 signature</text><rect x="56" y="466" width="1168" height="22" rx="6" fill="#181A21" stroke="#2B2F3A"/><rect x="56" y="466" width="50" height="22" rx="6" fill="#9B82FF"/><text x="1224" y="454" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#ECEDF1" text-anchor="end">~8 684 tokens  (4 %)</text><text x="56" y="532" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#A9ADBA" text-anchor="start">Measured on version 1.8.0 with an approximate tokenizer. Signatures counted at full definition size (upper bound).</text></svg>