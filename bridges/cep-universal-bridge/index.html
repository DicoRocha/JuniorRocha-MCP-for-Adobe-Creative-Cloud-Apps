<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Junior Rocha MCP</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      margin: 10px;
      font-size: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      background: #444;
    }
    .badge.connected {
      background: #1b5e20;
      color: #a5d6a7;
    }
    .badge.disconnected {
      background: #b71c1c;
      color: #ffcdd2;
    }
    button {
      background: #0d6efd;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 11px;
    }
    .busy {
      background: #3a2f00;
      color: #ffe082;
      border-radius: 4px;
      padding: 4px 8px;
      margin-bottom: 8px;
    }
    #log {
      width: 100%;
      height: 125px;
      background: #121212;
      color: #9cdcfe;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 6px;
      box-sizing: border-box;
      font-family: Consolas, monospace;
      font-size: 11px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="row">
    <div><strong>Junior Rocha MCP</strong> (<span id="hostName">...</span>)</div>
    <span id="statusBadge" class="badge disconnected">Disconnected</span>
  </div>
  <div class="row">
    <span>Hub: <code id="hubUrl">ws://127.0.0.1:31001</code></span>
    <button id="btnReconnect">Reconectar</button>
  </div>
  <div class="row">
    <span>Padr&atilde;o: ligado</span>
    <button id="btnPower" style="background:#555">Desligar MCP neste app</button>
  </div>
  <div id="notice" style="display:none;background:#0d2a4a;color:#9cdcfe;border-radius:4px;padding:4px 8px;margin-bottom:8px;word-break:break-all"></div>
  <div id="busy" class="busy" style="display:none"></div>
  <div id="log"></div>
  <script src="./js/main.js"></script>
</body>
</html>
