<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="514" viewBox="0 0 1280 514" role="img" aria-label="Architecture: MCP client, local server, local hub and one bridge inside each app"><title>Architecture: MCP client, local server, local hub and one bridge inside each app</title><rect width="1280" height="514" rx="16" fill="#0F1014"/><text x="56" y="64" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#9B82FF" text-anchor="start">HOW IT WORKS</text><rect x="56" y="92" width="262" height="112" rx="12" fill="#181A21" stroke="#2B2F3A"/><text x="76" y="128" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ECEDF1" text-anchor="start">MCP client</text><text x="76" y="158" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A9ADBA" text-anchor="start">Claude Desktop or any</text><text x="76" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A9ADBA" text-anchor="start">client that speaks MCP.</text><path d="M326 148h24M342 140l8 8-8 8" fill="none" stroke="#A9ADBA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="358" y="92" width="262" height="112" rx="12" fill="#181A21" stroke="#9B82FF"/><text x="378" y="128" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ECEDF1" text-anchor="start">JR-ADB MCP server</text><text x="378" y="158" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A9ADBA" text-anchor="start">Node.js on your machine.</text><text x="378" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A9ADBA" text-anchor="start">218 tools, one queue per app.</text><path d="M628 148h24M644 140l8 8-8 8" fill="none" stroke="#A9ADBA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="660" y="92" width="262" height="112" rx="12" fill="#181A21" stroke="#2B2F3A"/><text x="680" y="128" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ECEDF1" text-anchor="start">Local hub</text><text x="680" y="158" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A9ADBA" text-anchor="start">WebSocket on 127.0.0.1:31001.</text><text x="680" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A9ADBA" text-anchor="start">Local connections only.</text><path d="M930 148h24M946 140l8 8-8 8" fill="none" stroke="#A9ADBA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="962" y="92" width="262" height="112" rx="12" fill="#181A21" stroke="#2B2F3A"/><text x="982" y="128" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ECEDF1" text-anchor="start">Bridges</text><text x="982" y="158" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A9ADBA" text-anchor="start">Loaded by each app.</text><text x="982" y="180" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A9ADBA" text-anchor="start">Start with the app.</text><text x="56" y="256" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ECEDF1" text-anchor="start">Which bridge each app uses</text><rect x="56" y="276" width="1168" height="44" rx="8" fill="#181A21" stroke="#2B2F3A"/><text x="76" y="304" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#9B82FF" text-anchor="start">CEP extension</text><text x="360" y="304" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#ECEDF1" text-anchor="start">After Effects · Illustrator (second path: Premiere Pro, InDesign)</text><rect x="56" y="330" width="1168" height="44" rx="8" fill="#181A21" stroke="#2B2F3A"/><text x="76" y="358" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#9B82FF" text-anchor="start">UXP plug-ins</text><text x="360" y="358" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#ECEDF1" text-anchor="start">Photoshop · Premiere Pro · InDesign</text><rect x="56" y="384" width="1168" height="44" rx="8" fill="#181A21" stroke="#2B2F3A"/><text x="76" y="412" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#9B82FF" text-anchor="start">Lua plug-in</text><text x="360" y="412" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#ECEDF1" text-anchor="start">Lightroom Classic</text><rect x="56" y="438" width="1168" height="44" rx="8" fill="#181A21" stroke="#2B2F3A"/><text x="76" y="466" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#9B82FF" text-anchor="start">Direct scripting (fallback)</text><text x="360" y="466" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#ECEDF1" text-anchor="start">Photoshop · Illustrator · InDesign, when no bridge is connected</text></svg>