<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Context loaded per job: everything up front versus on demand"><title>Context loaded per job: everything up front versus on demand</title><rect width="1280" height="560" rx="16" fill="#0F1014"/><text x="56" y="64" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="14" font-weight="600" fill="#9B82FF" text-anchor="start">LOADS ONLY WHAT THE JOB NEEDS</text><text x="56" y="104" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ECEDF1" text-anchor="start">Approximate tokens of tool definitions and skills loaded for one job</text><text x="56" y="150" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ECEDF1" text-anchor="start">Everything up front</text><text x="416" y="150" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A9ADBA" text-anchor="start">220 tool definitions + 87 skills + router</text><rect x="56" y="162" width="1168" height="22" rx="6" fill="#181A21" stroke="#2B2F3A"/><rect x="56" y="162" width="1168" height="22" rx="6" fill="#3A3F4E"/><text x="1224" y="150" font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#ECEDF1" text-anchor="end">~202 689 tokens</text><text x="56" y="226" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ECEDF1" text-anchor="start">On demand: reel with captions</text><text x="416" y="226" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#A9ADBA" text-anchor="start">6 tools + router + 3 skills + 3 signatures</text><rect x="56" y="238" width="1168" height="22" rx="6" fill="#181A21" stroke="#2B2F3A"/><rect x="56" y="238" width="79" height="22" rx="6" fill="#9B82FF"/><t